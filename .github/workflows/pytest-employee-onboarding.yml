name: Tests (Employee Onboarding AgentCore)

on:
  push:
    branches: [main]
    paths: ['workday-extend-examples/employee-onboarding-agentcore-sample/**']
  pull_request:
    branches: [main]
    paths: ['workday-extend-examples/employee-onboarding-agentcore-sample/**']

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workday-extend-examples/employee-onboarding-agentcore-sample
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/agentcore/requirements.txt
          pip install pytest hypothesis

      - name: Run tests
        run: pytest tests/ -v
